<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf3e3" />
    <title>Gen-Stage · Văn phòng chibi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%91%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="loading">
      <div class="spin"></div>
      <p id="loading-text">Đang tải văn phòng…</p>
    </div>

    <header id="hud">
      <h1>Gen-Stage</h1>
      <p>Demo đợt 0 · văn phòng + nhân vật chibi</p>
    </header>

    <div id="toast"></div>

    <nav id="controls">
      <button type="button" data-act="wave">👋 Vẫy tay</button>
      <button type="button" data-act="happy">😊 Vui</button>
      <button type="button" data-act="surprised">😮 Ngạc nhiên</button>
      <button type="button" data-act="walk">🚶 Đi tới bàn 2</button>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
